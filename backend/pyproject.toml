[project]
name = "resumetailor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "litellm>=1.40.0",
    "rendercv[full]>=2.8",
    "pymupdf>=1.24.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "anyio[asyncio]>=4.0.0",
    "httpx>=0.27.0",
    # Quality gates. Pinned exactly: a gate that drifts is not a gate.
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.1",
    "types-PyYAML==6.0.12.20260906",
    "pre-commit==4.6.2",
    # Shuffles test order on every run so an order-dependent test cannot hide
    # again the way D-37 did. Closes B-05, raised by task 0.10.
    "pytest-randomly==5.0.0",
]

# ---------------------------------------------------------------------------
# Lint and format — `make lint` / `make fmt`
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "."]
extend-exclude = [".venv", "static", "out"]

[tool.ruff.lint]
# The target rule set. Nothing here is aspirational: every rule is enforced on
# every file that is not named in `per-file-ignores` below, and on every file
# added from now on. The legacy exemptions are itemised, counted, and owned by
# task 0.13.
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "C90",   # mccabe complexity
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async — blocking calls on the event loop (see D-05)
    "S",     # flake8-bandit
    "T20",   # flake8-print
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate — commented-out code
    "PIE",   # flake8-pie
    "ISC",   # implicit str concat
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "DTZ",   # flake8-datetimez — naive datetimes (see D-09)
    "EM",    # flake8-errmsg
    "TRY",   # tryceratops
    "BLE",   # flake8-blind-except (see D-52)
    "PT",    # flake8-pytest-style
    "SLF",   # private member access
    "Q",     # flake8-quotes
    "INP",   # implicit namespace packages
    "FBT",   # boolean trap
    "TID",   # flake8-tidy-imports — absolute imports, per AGENTS.md section 9
    "PL",    # pylint
]
ignore = [
    "B008",    # FastAPI expresses dependencies as `= Depends(...)` defaults. Framework idiom, permanent.
    "ISC001",  # Conflicts with the formatter; ruff emits a warning if both are on.
    "PLC0415", # Imports are deferred inside functions on purpose here: litellm, pymupdf and
               # rendercv each cost about a second to import and are not needed on every path.
               # Seven call sites already carry an inline `# noqa: PLC0415` saying exactly that.
]

[tool.ruff.lint.per-file-ignores]
# --- LEGACY EXEMPTIONS -----------------------------------------------------
# These are the modules wave 1.1 carried across the src-layout move unchanged,
# because moving code and reformatting it in the same diff is a diff nobody can
# review. They are named one by one rather than globbed as `src/resumetailor/**`
# so that everything 1.1 wrote (`core/`, `main.py`, `ports.py`) and everything
# added from now on is exempt from nothing.
#
# Each of these modules is split or rewritten by task 1.2, 1.3, 2.2 or 2.5 —
# see the comment at the top of each file. 153 findings are suppressed here.
# Task 0.13 clears them.
"src/resumetailor/{adapters,backend_api,database,deps,prompts,simulator,yaml_utils}.py" = [
    "RUF100",   # 7  — the inline `# noqa: PLC0415` directives read as unused now that PLC0415
                #      is globally ignored. Removing the directives is a source edit; task 0.13.
    "TID252",   # 47 — relative imports; absolute `resumetailor.*` arrives with the src-layout in 1.1
    "I001",     # 14 — unsorted imports; `ruff check --fix` clears these mechanically
    "E501",     # 12 — long lines
    "RUF001",   # 11 — ambiguous unicode in strings
    "TRY003",   # 6  — long messages at raise sites; the domain exception hierarchy lands in 1.1
    "ARG001",   # 6  — unused function arguments
    "F401",     # 6  — unused imports
    "BLE001",   # 5  — blind `except Exception` (this is D-52, fixed in 1.1, not here)
    "UP035",    # 4  — deprecated typing imports
    "EM102",    # 4  — f-string passed straight to an exception
    "E702",     # 3  — statements joined by a semicolon
    "PLR0913",  # 3  — too many arguments
    "PLR0917",  # 3  — too many positional arguments
    "RET504",   # 3  — assign-then-return
    "ARG002",   # 3  — unused method arguments
    "EM101",    # 2  — raw string passed straight to an exception
    "S608",     # 2  — SQL built by string construction (D-54 territory)
    "E741",     # 1  — ambiguous variable name
    "ASYNC240", # 1  — blocking path call in an async function (this is D-05)
    "C901",     # 1  — complex function
    "PLR2004",  # 1  — magic value in a comparison
    "B904",     # 1  — `raise` inside `except` without `from`
    "PLR0912",  # 1  — too many branches
    "PLR0915",  # 1  — too many statements
    "TRY300",   # 1  — `return` in `try` rather than `else`
]
# Same list, same owner (task 0.13). Split out only because ruff keys
# per-file-ignores by glob and these sit one directory down.
"src/resumetailor/api/routers/*.py" = [
    "RUF100",
    "TID252",
    "I001",
    "E501",
    "RUF001",
    "TRY003",
    "ARG001",
    "F401",
    "BLE001",
    "UP035",
    "EM102",
    "E702",
    "PLR0913",
    "PLR0917",
    "RET504",
    "ARG002",
    "EM101",
    "S608",
    "E741",
    "ASYNC240",
    "C901",
    "PLR2004",
    "B904",
    "PLR0912",
    "PLR0915",
    "TRY300",
]

# --- PERMANENT TEST EXEMPTIONS ---------------------------------------------
# These are properties of test code, not debt. They stay after task 0.13.
"tests/**" = [
    "S101",    # pytest asserts
    "PLR2004", # literal expected values are the point of an assertion
    "SLF001",  # tests reach into private helpers deliberately
    "ARG001",  # fixtures are requested by name and often not referenced
    "ARG002",
    "INP001",  # test packages are not importable modules
    # --- legacy, cleared by task 0.13 (149 of the below are S101, already permanent) ---
    "I001",    # 25 — unsorted imports
    "E741",    # 10 — ambiguous variable name
    "E702",    # 10 — semicolons
    "E501",    # 9  — long lines
    "F401",    # 6  — unused imports
    "E402",    # 4  — import not at top of file
    "UP035",   # 1
    "SIM117",  # 1  — nested `with`
    "PTH110",  # 1  — `os.path.exists`
    "PTH108",  # 1  — `os.unlink`
    "PT018",   # 1  — composite assertion
    "F811",    # 1  — redefinition
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["resumetailor", "tests"]

[tool.ruff.format]
docstring-code-format = true
# --- LEGACY EXEMPTIONS -----------------------------------------------------
# `ruff format --check` is enforced on every file NOT in this list, and on
# every file added from now on. These predate the formatter and reformatting
# them is a source change task 0.13 owns, not 1.1. Paths were retargeted by the
# src-layout move; `app/main.py` left the list because 1.1 rewrote main.py as an
# app factory and formatted it.
exclude = [
    "src/resumetailor/adapters.py",
    "src/resumetailor/backend_api.py",
    "src/resumetailor/database.py",
    "src/resumetailor/deps.py",
    "src/resumetailor/api/routers/chat.py",
    "src/resumetailor/api/routers/evaluate.py",
    "src/resumetailor/api/routers/resumes.py",
    "src/resumetailor/simulator.py",
    "src/resumetailor/yaml_utils.py",
    "tests/conftest.py",
    "tests/helpers/simulator.py",
    "tests/test_database.py",
    "tests/test_llm.py",
    "tests/test_rendercv_validation.py",
    "tests/test_routes_chat.py",
    "tests/test_routes_evaluate.py",
    "tests/test_routes_master_resume.py",
    "tests/test_routes_resumes.py",
    "tests/test_routes_rules.py",
]

# ---------------------------------------------------------------------------
# Types — `make typecheck`
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/resumetailor"]
# src-layout: the package is not installed (uv.lock declares this project
# `virtual`), so mypy is told where to find it, the same way pytest is below.
mypy_path = "src"
explicit_package_bases = true
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true
# Every relaxation below must be an explicit override with a reason. There is
# no global loosening of `strict`.

[[tool.mypy.overrides]]
# No stubs are published for these, and none of them is worth a hand-written one.
module = ["rendercv.*", "yaml", "litellm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# --- LEGACY EXEMPTIONS ---
# `--strict` on the pre-restructure modules produces 88 errors. 84 of them are
# these three codes: bare `dict`/`list` generics (39), unannotated defs (33),
# and calls into unannotated defs (12). They are annotation debt, not bugs, and
# the modules carrying them are split by tasks 1.2, 1.3, 2.2 and 2.5.
#
# Listed module by module rather than as `resumetailor.*` so that everything
# wave 1.1 wrote — `resumetailor.core.*`, `resumetailor.main`,
# `resumetailor.ports` — is under full `--strict`, as is anything added later.
# Every other strict check, including the four real findings pinned below,
# stays on. Task 0.14 clears these.
#
# `resumetailor.adapters` and `resumetailor.deps` are absent from this list and
# carry the same three codes in their own blocks below: mypy refuses two
# overrides that name the same module exactly, and those two also pin a real
# finding. A glob and an exact name may coexist, which is why
# `resumetailor.api.routers.*` can stay here alongside the `...routers.resumes`
# pin below.
module = [
    "resumetailor.backend_api",
    "resumetailor.database",
    "resumetailor.prompts",
    "resumetailor.simulator",
    "resumetailor.yaml_utils",
    "resumetailor.api.routers.*",
]
disable_error_code = ["type-arg", "no-untyped-def", "no-untyped-call"]

# The remaining four are genuine and each is already a registered defect.
# They are pinned to one module and one error code so that the same class of
# bug in any other module still fails the build.
[[tool.mypy.overrides]]
# D-59: provider `content` is `str | None` on a refusal and flows into a
# function declared to return `str`. Also a pymupdf stub gap: `Document` is
# iterable at runtime but the shipped stub does not say so.
# `no-any-return` and `attr-defined` are the real findings; the three that
# follow them are the same annotation debt as the block above, and go with it
# when task 0.14 runs.
module = ["resumetailor.adapters"]
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
]

[[tool.mypy.overrides]]
# `SimulatedBackendAPI` does not structurally satisfy the `BackendAPI` port.
# Real; fixed when the port boundary is rebuilt in task 1.3. `return-value` is
# the real finding; the three that follow are annotation debt for task 0.14,
# here rather than in the block above for the reason given there.
module = ["resumetailor.deps"]
disable_error_code = [
    "return-value",
    "type-arg",
    "no-untyped-def",
    "no-untyped-call",
]

[[tool.mypy.overrides]]
# An `Optional` return is handed to `asyncio.to_thread` where a non-optional
# is expected. Real; part of D-20 (partial-failure orphans).
module = ["resumetailor.api.routers.resumes"]
disable_error_code = ["arg-type"]

# ---------------------------------------------------------------------------
# Tests and coverage — `make test`
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout. `resumetailor` lives under `src/`; `tests.helpers` is imported by
# name from `tests/conftest.py`, so `.` stays on the path too. The project is
# `virtual` in uv.lock (uv installs the dependency tree but not this package),
# so neither entry can be dropped until that changes — which means regenerating
# uv.lock and reordering the Dockerfile's dependency layer. See the 1.1 report.
pythonpath = ["src", "."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=resumetailor",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=79",
]
xfail_strict = true
filterwarnings = ["default"]
markers = [
    "slow: takes more than a second; excluded from the pre-commit run",
    "integration: crosses a process or filesystem boundary",
]

[tool.coverage.run]
branch = false
source = ["resumetailor"]

[tool.coverage.report]
precision = 2
show_missing = true
# MEASURED, NOT ASPIRATIONAL. The suite covers 79.68% of `src/resumetailor/`
# (89 tests, 989 statements, 201 uncovered). The floor is set one point below
# that so the gate fails on a regression and not on rounding.
# AGENTS.md section 8 requires 85% on `domain/`, `services/` and `db/`.
# Those packages do not exist yet. Task 3.6 creates them and raises this
# number; raising it here would only produce a build that cannot go green.
fail_under = 79
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"
