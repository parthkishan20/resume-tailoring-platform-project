# RenderCV `settings` overlay, passed as `--settings` by rendering/runner.py.
#
# It used to be dead configuration that nothing read, and it carried one
# particular person's name as the PDF title (PLAN.md D-15). `NAME` is
# RenderCV's own placeholder for `cv.name`, so the title now follows whoever
# the resume belongs to.
#
# `render_command.design` and `render_command.locale` are deliberately absent.
# RenderCV resolves both as paths *relative to the input file*, and the input
# file is a per-render temp directory, so naming them here fails validation
# before anything is rendered. Both are passed on the command line instead.
settings:
  current_date: today
  bold_keywords: []
  pdf_title: NAME - Resume
  render_command:
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_png: true
