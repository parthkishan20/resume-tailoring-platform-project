name: CI

# Every push and every pull request. No Docker, no LLM call, no API key:
# the backend suite runs against the deterministic stub (LLM_MOCK), and the
# frontend suite runs against jsdom.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tailoring pipeline must never reach a provider from CI.
  LLM_MOCK: "1"
  # Fail the build on a deprecation that Next or Jest would otherwise only warn about.
  CI: "true"

jobs:
  # --------------------------------------------------------------------------
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.11"
          # Matches `python_version` in [tool.mypy] and the Dockerfile's base
          # image. `requires-python = ">=3.12"` alone would let CI drift to a
          # newer interpreter than the one the image runs.
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock has drifted from pyproject.toml, so a
        # dependency can never be added without the lockfile in the same commit.
        run: uv sync --locked --all-groups

      - name: ruff check
        run: uv run -- ruff check --output-format=github .

      - name: ruff format --check
        run: uv run -- ruff format --check .

      - name: mypy
        run: uv run -- mypy

      - name: pytest
        # Coverage floor lives in pyproject.toml ([tool.coverage.report]
        # fail_under). It is the measured level today, not the 85% target;
        # task 3.6 raises it.
        run: uv run -- pytest

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  frontend:
    name: frontend (eslint, prettier, tsc, jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: prettier --check
        run: npm run format:check

      - name: tsc --noEmit
        run: npm run typecheck

      - name: jest
        run: npm run test:ci

      - name: next build
        run: npm run build

  # --------------------------------------------------------------------------
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans history, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks
        # The released binary rather than gitleaks-action: the action requires
        # a licence key on organization accounts, and this pins the exact same
        # version the pre-commit hook uses.
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree
        run: gitleaks dir . --redact --verbose

      - name: Scan git history
        run: gitleaks git . --redact --verbose

  # --------------------------------------------------------------------------
  # One required check to point branch protection at, so adding a job above
  # does not mean editing the protection rules.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, secrets]
    if: always()
    steps:
      - name: Fail if any job failed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "one or more CI jobs failed"
            exit 1
          fi
          echo "all CI jobs passed"
