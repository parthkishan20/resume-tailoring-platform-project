# docker-compose.test.yml — the hermetic e2e stack.
#
# This stack is deliberately isolated from the dev/production stack in
# docker-compose.yml on every axis that could let a test run reach real data:
#
#   - Project name  `resumetailor-e2e`   (dev compose has none, so it uses the
#                                         directory name `resume-tailoring-platform`)
#   - Image tag     `resumetailor-e2e`   (dev builds `resumetailor`)
#   - Host port     ${E2E_HOST_PORT:-18173}  (dev binds 8000)
#   - Storage       tmpfs, discarded when the container stops
#                                        (dev uses the persistent named volumes
#                                         resumedb-data / resumepdf-data)
#   - No env_file, so no real OPENAI_API_KEY can be loaded here.
#
# Run it with scripts/run_e2e.sh (or scripts/run_e2e.ps1), which tears the
# stack down afterwards. See README "Tests".

name: resumetailor-e2e

services:
  app:
    build: .
    image: resumetailor-e2e
    # Published only so a developer can point a browser or a host-side
    # `npx playwright test` at the test stack. Never 8000: that is the dev stack.
    ports:
      - "${E2E_HOST_PORT:-18173}:8000"
    # Ephemeral by design. tmpfs is wiped when the container stops, so no
    # generated resume, PDF, or chat row survives into the next run and no
    # spec can pass on residue.
    tmpfs:
      # D-73: a bare `tmpfs: - /path` entry does not reliably get the kernel's
      # default tmpfs mode (1777) from this Compose/Docker combination -- it
      # was observed mounting root:root 0755, which the non-root uid 10001
      # app user cannot write into, so `migrate()` fails to open the database
      # before any spec can run. `/app/db` and `/app/pdfs` are explicit about
      # ownership and mode rather than relying on the kernel default the way
      # `/tmp` below still does.
      - /app/db:uid=10001,gid=10001,mode=1770
      - /app/pdfs:uid=10001,gid=10001,mode=1770
      # D-50: the render scratch, same as the dev stack. A tmpfs mount is
      # created mode 1777 (the kernel's default for tmpfs with no `mode=`
      # option), so it stays writable now that the image runs as uid 10001 and
      # not root.
      - /tmp
    environment:
      - LLM_MOCK=true
      - OPENAI_API_KEY=mock-key-not-used
      - LLM_MODEL=gpt-4o-mini
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright:v1.44.0-jammy
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./test:/test
    working_dir: /test
    command: npx playwright test
    environment:
      # Container-network address of the test app. Port 8000 here is inside
      # the compose network and is not the host's 8000.
      - BASE_URL=http://app:8000
